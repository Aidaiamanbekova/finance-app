<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-success text-white">Register</div>
                <div class="card-body">
                    <div id="error" class="alert alert-danger d-none"></div>
                    <div id="success" class="alert alert-success d-none"></div>
                    <form id="registerForm">
                        <input type="text" id="username" class="form-control mb-2" placeholder="Username">
                        <input type="email" id="email" class="form-control mb-2" placeholder="Email">
                        <input type="password" id="password" class="form-control mb-2" placeholder="Password">
                        <button type="submit" class="btn btn-success w-100">Register</button>
                    </form>
                    <a href="/login" class="mt-3 d-block text-center">Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });
            if (res.ok) {
                document.getElementById('success').innerText = 'Registered! Redirecting...';
                document.getElementById('success').classList.remove('d-none');
                setTimeout(() => window.location.href = '/login', 2000);
            } else {
                const err = await res.text();
                document.getElementById('error').innerText = err;
                document.getElementById('error').classList.remove('d-none');
            }
        } catch (err) {
            document.getElementById('error').innerText = err.message;
            document.getElementById('error').classList.remove('d-none');
        }
    });
</script>
</body>
</html>
